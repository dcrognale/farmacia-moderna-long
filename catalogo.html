<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Productos — Farmacia Moderna</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Barlow:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/img/favicon-192.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="catalog">
<div data-include="partials/header.html"></div>
<main>
  <section class="page-title"><div class="container">
    <nav class="breadcrumb" aria-label="Ruta de navegación"><a href="index.html">Inicio</a> <span aria-hidden="true">/</span> Productos</nav>
    <h1 class="heading" data-catalog-title>Todos los productos</h1>
  </div></section>
  <section class="catalog" data-catalog><div class="container">
    <div class="catalog-bar">
      <form id="catalog-search-form" class="search catalog-search" role="search">
        <label class="visually-hidden" for="catalog-q">Buscar en el catálogo</label>
        <input id="catalog-q" type="search" maxlength="100" autocomplete="off" placeholder="Buscar productos">
        <button type="submit" aria-label="Buscar"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
      </form>
      <div class="field catalog-sort"><label for="catalog-sort">Ordenar por</label><select id="catalog-sort"></select></div>
    </div>
    <div class="chips" data-catalog-chips role="group" aria-label="Filtrar por categoría"></div>
    <p class="catalog-count" data-catalog-count role="status" aria-live="polite"></p>
    <div class="grid" data-catalog-grid></div>
    <div class="pager" data-catalog-pager></div>
  </div></section>
</main>
<div data-include="partials/footer.html"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
